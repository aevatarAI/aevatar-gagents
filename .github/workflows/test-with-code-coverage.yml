name: Test with code coverage

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'feature/test-coverage-workflow'
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  DOTNET_INSTALL_DIR: "./.dotnet"

jobs:
  test-aigagent:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: chown (if needed)
        run: |
          if [ -d /home/runneradmin ]; then sudo chown -R $USER:$USER /home/runneradmin; fi
      - name: Install dependencies
        run: dotnet restore --verbosity quiet
      - name: Build
        run: dotnet build --no-restore /clp:ErrorsOnly /p:GeneratePackageOnBuild=false --verbosity quiet
      - name: Test AIGAgent
        run: |
          dotnet test test/Aevatar.GAgents.AIGAgent.Test --no-restore --no-build --verbosity normal --logger trx --settings CodeCoverage.runsettings --results-directory ../coverage-aigagent --collect:"XPlat Code Coverage"
      - name: Upload AIGAgent coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aigagent
          path: coverage-aigagent/

  test-twitter:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
