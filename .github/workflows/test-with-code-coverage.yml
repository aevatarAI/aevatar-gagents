  test-multiaichat:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install dependencies
        run: dotnet restore --verbosity quiet
      - name: Build
        run: dotnet build --no-restore /clp:ErrorsOnly /p:GeneratePackageOnBuild=false --verbosity quiet
      - name: Test MultiAIChat
        run: |
          dotnet test test/Aevatar.GAgents.MultiAIChatGAgent.Test --no-restore --no-build --verbosity normal --logger trx --settings CodeCoverage.runsettings --results-directory ../coverage-multiaichat --collect:"XPlat Code Coverage"
      - name: Upload MultiAIChat coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-multiaichat
          path: coverage-multiaichat/

  upload-coverage:
    runs-on: ubuntu-22.04
    needs: [test-aigagent, test-twitter, test-groupchat, test-mcp, test-workflow, test-chatagent, test-multiaichat]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download AIGAgent coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-aigagent
          path: coverage-aigagent/
      - name: Download Twitter coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-twitter
          path: coverage-twitter/
      - name: Download GroupChat coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-groupchat
          path: coverage-groupchat/
      - name: Download MCP coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-mcp
          path: coverage-mcp/
      - name: Download Workflow coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-workflow
          path: coverage-workflow/
      - name: Download ChatAgent coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-chatagent
          path: coverage-chatagent/
      - name: Download MultiAIChat coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-multiaichat
          path: coverage-multiaichat/
      - name: Upload unified coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true # Set to true to expose errors
          directory: ./
          flags: unittests
          name: codecov-umbrella
          verbose: true # Detailed logging
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}