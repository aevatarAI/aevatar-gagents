        with:
          name: coverage-twitter
          path: coverage-twitter/

  test-groupchat:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install dependencies
        run: dotnet restore --verbosity quiet
      - name: Build
        run: dotnet build --no-restore /clp:ErrorsOnly /p:GeneratePackageOnBuild=false --verbosity quiet
      - name: Test GroupChat
        run: |
          dotnet test test/Aevatar.GAgents.GroupChat.Test --no-restore --no-build --verbosity normal --logger trx --settings CodeCoverage.runsettings --results-directory ../coverage-groupchat --collect:"XPlat Code Coverage"
      - name: Upload GroupChat coverage artifacts
