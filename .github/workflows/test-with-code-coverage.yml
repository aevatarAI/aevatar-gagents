name: Test with code coverage

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'feature/test-coverage-workflow'
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  DOTNET_INSTALL_DIR: "./.dotnet"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: chown (if needed)
        run: |
          if [ -d /home/runneradmin ]; then sudo chown -R $USER:$USER /home/runneradmin; fi
      - name: Install dependencies
        run: dotnet restore AevatarGAgents.sln --verbosity quiet
      - name: Build
        run: dotnet build AevatarGAgents.sln --no-restore /clp:ErrorsOnly /p:GeneratePackageOnBuild=false --verbosity quiet
      - name: Test with coverage
        run: |
          dotnet test AevatarGAgents.sln --no-restore --no-build --verbosity normal --logger trx --settings CodeCoverage.runsettings --results-directory coverage --collect:"XPlat Code Coverage"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  upload-coverage:
    runs-on: ubuntu-22.04
    needs: [test]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: Upload unified coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true # Set to true to expose errors
          directory: ./
          flags: unittests
          name: codecov-umbrella
          verbose: true # Detailed logging
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}