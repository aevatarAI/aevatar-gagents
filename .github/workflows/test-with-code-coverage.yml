      - name: Install dependencies
        run: dotnet restore --verbosity quiet
      - name: Build
        run: dotnet build --no-restore /clp:ErrorsOnly /p:GeneratePackageOnBuild=false --verbosity quiet
      - name: Test MCP
        run: |
          dotnet test test/Aevatar.GAgents.MCP.Test --no-restore --no-build --verbosity normal --logger trx --settings CodeCoverage.runsettings --results-directory ../coverage-mcp --collect:"XPlat Code Coverage"
