          dotnet test test/Aevatar.GAgents.Twitter.Test --no-restore --no-build --verbosity normal --logger trx --settings CodeCoverage.runsettings --results-directory ../coverage-twitter --collect:"XPlat Code Coverage"
      - name: Upload Twitter coverage artifacts
